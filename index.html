<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mia's Games</title>
  <style>
    body {
      margin: 0; min-height: 100vh; background: #BFE6FF; color: #22335B;
      font-family: "Comic Sans MS", "Trebuchet MS", sans-serif;
    }
    .arcade { text-align: center; padding: 24px; }
    .arcade ul { list-style: none; padding: 0; }
    .arcade li { margin: 12px; }
    .arcade a { color: #22335B; font-size: 1.4rem; }
    button {
      font: inherit; font-size: 1.6rem; font-weight: bold; color: #22335B;
      background: #FFD23F; border: 4px solid #22335B; border-radius: 24px;
      padding: 10px 24px; margin: 4px; cursor: pointer; box-shadow: 0 6px 0 #22335B;
    }
    button:active { transform: translateY(4px); box-shadow: 0 2px 0 #22335B; }
    .puzzle {
      margin: 16px; padding: 16px; font-size: 22px; color: white;
      background: tomato; border-radius: 16px; white-space: pre-wrap;
    }
  </style>
  <script>
    // Salomé's. If something breaks before the arcade can show it, this puts
    // the puzzle on the page in big words instead of leaving it blank.
    function showThePuzzle(message) {
      var box = document.createElement("pre");
      box.className = "puzzle";
      box.textContent = "It's not broken, it's a puzzle:\n" + message;
      document.body.prepend(box);
    }
    window.addEventListener("error", function onError(event) {
      var file = event.filename ? event.filename.split("/").pop().split("?")[0] : "";
      var where = file ? "\n" + file + " line " + event.lineno : "";
      showThePuzzle(event.message + where);
    });
    window.addEventListener("unhandledrejection", function onRejection(event) {
      showThePuzzle(String(event.reason));
    });
  </script>
</head>
<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>
</html>
